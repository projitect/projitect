packages:
  - packages/*
  - apps/*

onlyBuiltDependencies:
  - esbuild

# Security overrides for transitive dependencies; each entry names the advisories it covers.
overrides:
  # GHSA-g7r4-m6w7-qqqr (esbuild via tsx)
  "esbuild@<0.28.1": "0.28.1"
  # GHSA-h67p-54hq-rp68, GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh (js-yaml via changesets)
  "js-yaml@>=3 <4": "3.15.2"
  "js-yaml@>=4 <4.3.2": "4.3.2"
  # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895, GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p (brace-expansion via minimatch)
  "brace-expansion@<2": "1.1.21"
  "brace-expansion@>=2 <5.0.12": "5.0.12"
  # GHSA-fxqj-rqcc-2cmp, GHSA-r28c-9q8g-f849 (postcss via expressive-code)
  "postcss@<8.5.23": "8.5.23"
  # GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8 (nanoid via postcss)
  "nanoid@<3.3.18": "3.3.18"
  # GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g (browserslist via eslint-plugin-unicorn)
  "browserslist@<4.28.7": "4.28.7"
  # GHSA-w5vr-8v7q-w6rv (baseline-browser-mapping via browserslist)
  "baseline-browser-mapping@<2.11.0": "2.11.0"
  # GHSA-7w5x-hrqm-74c2, GHSA-r4xh-jqrq-34v2 (smol-toml via knip)
  "smol-toml@<1.9.0": "1.9.0"
  # GHSA-mrhx-c7xc-m3w5 (zod via knip)
  "zod@<4.6.6": "4.6.6"
  # GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h, GHSA-wjr9-j795-jxcr, GHSA-333x-w4r6-6crp (fast-uri via ajv)
  "fast-uri@<3.1.9": "3.1.9"
  # GHSA-g3hv-75wg-m249 (minimatch via typescript-estree)
  "minimatch@>=10 <11.0.1": "11.0.1"
