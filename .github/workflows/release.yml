name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # npm trusted publishing (OIDC) needs npm >= 11.5.1 and Node >= 22.14.0
      - run: npm install -g npm@^11.5.1
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Owner-approved first real release only; remove after package OIDC setup.
          # Keep this credential off install/build steps and PR workflows.
          NPM_TOKEN: ${{ secrets.PROJITECT_FIRST_RELEASE_NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.PROJITECT_FIRST_RELEASE_NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # Best-effort: a comment failure must never fail the publish job.
      - if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        run: pnpm release:comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
